<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Danish Khan • WhatsApp Pair Code</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#f5f7fb;background:#05060a;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;z-index:-2;background:radial-gradient(circle at 20% 20%,#3a2470 0,transparent 28%),radial-gradient(circle at 80% 80%,#004d48 0,transparent 28%),radial-gradient(circle at 80% 15%,#4a1738 0,transparent 22%);filter:blur(20px)}
body:after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(120deg,#05060add,#070913aa 45%,#05060add)}
.wrap{width:min(760px,92%);margin:42px auto 70px}.top{text-align:center}.pill{display:inline-block;border:1px solid #4b5270;background:#111426;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.16em;color:#cbd0ff}
h1{font-size:clamp(34px,8vw,60px);letter-spacing:-.05em;margin:18px 0 6px}.sub{color:#9ba4b7}.card{margin-top:28px;padding:28px;border-radius:30px;border:1px solid #2a3040;background:#0c0f17e8;box-shadow:0 30px 100px #0009;backdrop-filter:blur(20px)}
label{display:block;font-weight:800;margin-bottom:10px}.input{width:100%;border:1px solid #333b4d;background:#07090e;color:#fff;border-radius:16px;padding:17px;font-size:18px;outline:0}.input:focus{border-color:#8668ff}.hint{font-size:12px;color:#7f899b;margin:9px 0 18px}
button{border:0;border-radius:16px;padding:16px;font-size:15px;font-weight:900;cursor:pointer}.primary{width:100%;color:#fff;background:linear-gradient(135deg,#704cff,#a16cff);box-shadow:0 15px 45px #704cff33}.secondary{background:#171b25;color:#fff;border:1px solid #303849}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.code{margin-top:22px;padding:24px;border-radius:20px;text-align:center;background:#070a10;border:1px dashed #4a5368}.code small{color:#8c96a9}.code strong{display:block;margin-top:10px;font-size:34px;letter-spacing:.18em;color:#fff}.status{margin-top:16px;padding:14px;border-radius:14px;background:#070a10;color:#aeb7c7;font-size:14px}.ok{color:#00e5a8}.err{color:#ff6684}.foot{margin-top:18px;color:#687286;font-size:12px;line-height:1.6}
@media(max-width:520px){.card{padding:20px}.row{grid-template-columns:1fr}.code strong{font-size:27px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="pill">DANISH KHAN • WA CORE</span>
    <h1>WhatsApp Pair Code</h1>
    <div class="sub">Secure device linking for a WhatsApp account you own.</div>
  </div>

  <main class="card">
    <label for="number">WhatsApp number</label>
    <input id="number" class="input" inputmode="numeric" autocomplete="tel" value="917050407246">
    <div class="hint">Include country code. Digits only — no +, spaces or dashes.</div>

    <button id="pair" class="primary">Generate Pair Code</button>

    <div id="codeBox" class="code" hidden>
      <small>PAIR CODE</small>
      <strong id="code">--------</strong>
    </div>

    <div class="row">
      <button id="copy" class="secondary">Copy Code</button>
      <button id="download" class="secondary">Download creds.json</button>
    </div>

    <div class="row">
      <button id="status" class="secondary">Check Status</button>
      <button id="reset" class="secondary">Reset Session</button>
    </div>

    <div id="msg" class="status">Ready.</div>
    <div class="foot">The session is stored on the server under auth_info. Do not share creds.json or other session/key files.</div>
  </main>
</div>

<script>
const $=id=>document.getElementById(id);
let pairCode="";
const num=()=>$( "number").value.replace(/\D/g,"");

function message(t,c=""){ $("msg").className="status "+c; $("msg").textContent=t; }

$("pair").onclick=async()=>{
  const number=num();
  if(!/^\d{7,15}$/.test(number)){message("Enter 7–15 digits including country code.","err");return}
  $("pair").disabled=true; message("Generating pairing code…");
  try{
    const r=await fetch("/api/pair",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({number})});
    const d=await r.json();
    if(!r.ok||!d.ok) throw new Error(d.error||"Pairing failed");
    if(d.code){
      pairCode=d.code;
      $("code").textContent=d.code;
      $("codeBox").hidden=false;
      message("Code ready. WhatsApp → Linked Devices → Link with phone number.","ok");
    }else{
      message(d.message||"A saved session already exists.","ok");
    }
  }catch(e){message(e.message,"err")}
  finally{$("pair").disabled=false}
};

$("copy").onclick=async()=>{
  if(!pairCode){message("Generate a pair code first.");return}
  await navigator.clipboard.writeText(pairCode);
  message("Pair code copied.","ok");
};

$("download").onclick=()=>{
  const number=num();
  location.href="/api/download-creds?number="+encodeURIComponent(number);
};

$("status").onclick=async()=>{
  const number=num();
  try{
    const d=await (await fetch("/api/status?number="+encodeURIComponent(number))).json();
    message("Status: "+d.status+(d.credsSaved?" • creds.json saved":""));
  }catch{message("Status check failed.","err")}
};

$("reset").onclick=async()=>{
  const number=num();
  if(!confirm("Delete the saved session for this number?"))return;
  await fetch("/api/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({number})});
  $("codeBox").hidden=true; pairCode=""; message("Session reset.","ok");
};
</script>
</body>
</html>
